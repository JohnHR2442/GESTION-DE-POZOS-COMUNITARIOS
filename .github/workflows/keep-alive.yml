name: Keep Render Awake

# Mantiene despierto el servidor gratuito de Render enviando una señal
# (ping) cada 10 minutos, para que el aviso automático de días festivos
# se dispare a tiempo. También se puede ejecutar manualmente.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al servidor
        run: |
          echo "Enviando ping a Render..."
          curl -s -m 30 https://gestion-de-pozos-comunitarios.onrender.com/api/ || true
          echo "Ping enviado."
